<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Le Mans Ultimate 개인 셋업 라이브러리" /><title>LMU Setup Library</title><link rel="stylesheet" href="styles.css" /></head>
<body><header><a class="brand" href="#library">LMU <span>SETUP LIBRARY</span></a><nav><button class="nav-link active" data-view="library">셋업 라이브러리</button><button class="nav-link" data-view="raw">RAW 데이터</button></nav><span class="release" id="release">RELEASE V1.4</span></header>
<main>
  <section id="library" class="view active"><div class="page-head"><div><p class="eyebrow">SETUP LIBRARY</p><h1>셋업을 찾고 바로 받으세요.</h1></div><p id="result-summary" aria-live="polite"></p></div>
  <div class="filters" aria-label="셋업 검색"><label>클래스<select id="class-filter"><option value="">전체 클래스</option></select></label><label>서킷<select id="track-filter"><option value="">전체 서킷</option></select></label><label>차량<select id="vehicle-filter"><option value="">클래스를 먼저 선택하세요</option></select></label><button id="search-button" class="button primary" type="button">셋업 검색 <span>→</span></button><button id="reset" class="button ghost" type="button">초기화</button></div>
  <p class="hint" id="setup-note">선택한 차량과 서킷에 맞는 안정형 기준 셋업을 보여줍니다.</p><div id="setup-grid" class="setup-grid"></div><p id="empty" class="empty" hidden>선택한 조건에 맞는 셋업이 없습니다.</p></section>
  <section id="raw" class="view"><div class="page-head"><div><p class="eyebrow">SOURCE WORKBOOK</p><h1>RAW 데이터</h1></div><p class="raw-note">원본: 안정형 전체 셋업 DB · 2026.07</p></div><div class="tabs"><button class="tab active" data-table="tracks">서킷 특성</button><button class="tab" data-table="cars">차량 특성</button></div><div class="raw-table-wrap"><table id="raw-table"></table></div></section>
</main><footer><span>개인용 LMU 셋업 라이브러리</span><span>패치·BoP 변경 시 재검증 필요</span></footer><template id="setup-card"><article class="setup-card"><div class="card-top"><span class="class-badge"></span><span class="confidence"></span></div><h2></h2><p class="track"></p><dl><div><dt>템플릿</dt><dd class="template"></dd></div><div><dt>상태</dt><dd class="status"></dd></div></dl><a class="button download" download>SVM 다운로드 <span>↓</span></a></article></template><script src="app.js"></script></body></html>
