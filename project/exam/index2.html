<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Sprint · Chapters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@500;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style2.css" />
    <style>.intro{margin:10px 0 24px;color:#78827b}.word-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.word-row{display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:12px;background:#f5f6f1}.word-row b{font:500 16px 'DM Mono',monospace}.word-number{color:#79a856;font:500 13px 'DM Mono',monospace}@media(max-width:520px){.word-list{grid-template-columns:1fr}}</style>
  </head>
  <body><main class="app-shell"><section class="card">
    <header><a class="brand" href="index2.html">word<span>sprint</span></a></header>
    <section id="setup-view"><p class="eyebrow">단어 연습</p><h1>Chapter와<br />표시 방식을 선택하세요.</h1><fieldset><legend>Chapter</legend><div id="chapter-options" class="options"></div></fieldset><fieldset><legend>표시 방식</legend><div class="options mode-options"><label><input type="radio" name="mode" value="english" checked /><span>영어 단어</span><small>영어 단어 30개</small></label><label><input type="radio" name="mode" value="korean" /><span>뜻</span><small>뜻 30개</small></label><label><input type="radio" name="mode" value="mixed" /><span>반반</span><small>영어 15개 · 뜻 15개</small></label></div></fieldset><button id="start" class="primary">단어 리스트 보기 <span>→</span></button></section>
    <section id="list-view" hidden><p id="list-eyebrow" class="eyebrow"></p><h1>단어 리스트</h1><p class="intro">새로 열 때마다 순서가 랜덤으로 섞입니다.</p><div id="word-list" class="word-list"></div><button id="again" class="primary">메인으로 돌아가기 <span>↻</span></button></section>
  </section></main><script src="app2.js"></script></body>
</html>
